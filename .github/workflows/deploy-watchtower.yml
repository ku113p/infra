name: Deploy Watchtower

on:
  push:
    branches: [master]
    paths:
      - 'compose/watchtower/**'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.VPS_SSH_KEY }}

      - name: Add VPS to known hosts
        run: ssh-keyscan -H ${{ secrets.VPS_HOST }} >> ~/.ssh/known_hosts

      - name: Sync watchtower compose file
        run: |
          SERVER="root@${{ secrets.VPS_HOST }}"
          rsync -avz compose/watchtower/docker-compose.yml ${SERVER}:/opt/services/watchtower/

      - name: Restart watchtower
        run: |
          SERVER="root@${{ secrets.VPS_HOST }}"
          ssh ${SERVER} "cd /opt/services/watchtower && docker compose up -d"

      - name: Verify health
        run: |
          SERVER="root@${{ secrets.VPS_HOST }}"
          sleep 5
          ssh ${SERVER} "docker ps --filter name=watchtower --format '{{.Status}}' | grep -q 'Up'" || \
            (echo "FAIL: watchtower not running" && exit 1)
