name: Deploy Interview

on:
  push:
    branches: [master]
    paths:
      - 'compose/interview/**'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.VPS_SSH_KEY }}

      - name: Add VPS to known hosts
        run: ssh-keyscan -H ${{ secrets.VPS_HOST }} >> ~/.ssh/known_hosts

      - name: Sync interview compose file
        run: |
          SERVER="root@${{ secrets.VPS_HOST }}"
          rsync -avz compose/interview/docker-compose.yml ${SERVER}:/opt/services/interview/

      - name: Restart interview services
        run: |
          SERVER="root@${{ secrets.VPS_HOST }}"
          ssh ${SERVER} "cd /opt/services/interview && docker compose up -d"

      - name: Verify health
        run: |
          SERVER="root@${{ secrets.VPS_HOST }}"
          sleep 10
          RUNNING=$(ssh ${SERVER} "docker ps --filter 'name=interview-' --format '{{.Names}}' | wc -l")
          if [ "$RUNNING" -lt 3 ]; then
            echo "FAIL: expected 3 interview containers, found $RUNNING"
            ssh ${SERVER} "docker ps -a --filter 'name=interview-' --format 'table {{.Names}}\t{{.Status}}'"
            exit 1
          fi
          ssh ${SERVER} "docker ps --filter 'name=interview-' --format 'table {{.Names}}\t{{.Status}}\t{{.Ports}}'"
