name: Deploy Crypto Assets

on:
  push:
    branches: [master]
    paths:
      - 'compose/crypto-assets/**'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.VPS_SSH_KEY }}

      - name: Add VPS to known hosts
        run: ssh-keyscan -H ${{ secrets.VPS_HOST }} >> ~/.ssh/known_hosts

      - name: Sync compose files
        run: |
          SERVER="root@${{ secrets.VPS_HOST }}"
          rsync -avz compose/crypto-assets/docker-compose.yml ${SERVER}:/opt/services/crypto-assets/

      - name: Restart services
        run: |
          SERVER="root@${{ secrets.VPS_HOST }}"
          ssh ${SERVER} "cd /opt/services/crypto-assets && docker compose up -d"

      - name: Verify health
        run: |
          SERVER="root@${{ secrets.VPS_HOST }}"
          sleep 10
          RUNNING=$(ssh ${SERVER} "docker ps --filter 'name=crypto-assets' --format '{{.Names}}' | wc -l")
          if [ "$RUNNING" -lt 1 ]; then
            echo "FAIL: expected 1 crypto-assets container, found $RUNNING"
            ssh ${SERVER} "docker ps -a --filter 'name=crypto-assets' --format 'table {{.Names}}\t{{.Status}}'"
            exit 1
          fi
          ssh ${SERVER} "docker ps --filter 'name=crypto-assets' --format 'table {{.Names}}\t{{.Status}}\t{{.Ports}}'"
