name: Deploy Landing

on:
  push:
    branches: [master]
    paths:
      - 'compose/landing/**'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.VPS_SSH_KEY }}

      - name: Add VPS to known hosts
        run: ssh-keyscan -H ${{ secrets.VPS_HOST }} >> ~/.ssh/known_hosts

      - name: Sync landing files
        run: |
          SERVER="root@${{ secrets.VPS_HOST }}"
          rsync -avz --delete \
            --exclude='.env' \
            --exclude='node_modules' \
            compose/landing/ ${SERVER}:/opt/services/landing/

      - name: Write .env from secrets
        run: |
          SERVER="root@${{ secrets.VPS_HOST }}"
          ssh ${SERVER} "cat > /opt/services/landing/.env << 'ENVEOF'
          LANDING_NAME=${{ secrets.LANDING_NAME }}
          LANDING_TITLE=${{ secrets.LANDING_TITLE }}
          LANDING_BIO=${{ secrets.LANDING_BIO }}
          LANDING_EMAIL=${{ secrets.LANDING_EMAIL }}
          LANDING_TELEGRAM=${{ secrets.LANDING_TELEGRAM }}
          LANDING_LINKEDIN=${{ secrets.LANDING_LINKEDIN }}
          ENVEOF"

      - name: Build and restart landing
        run: |
          SERVER="root@${{ secrets.VPS_HOST }}"
          ssh ${SERVER} "cd /opt/services/landing && docker compose up -d --build"

      - name: Verify health
        run: |
          SERVER="root@${{ secrets.VPS_HOST }}"
          sleep 10
          ssh ${SERVER} "docker ps --filter name=landing --format '{{.Status}}' | grep -q 'Up'" || \
            (echo "FAIL: landing not running" && exit 1)
          ssh ${SERVER} "docker ps --filter name=landing --format 'table {{.Names}}\t{{.Status}}\t{{.Ports}}'"
