name: Deploy Landing

on:
  push:
    branches: [master]
    paths:
      - 'compose/landing/**'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.VPS_SSH_KEY }}

      - name: Add VPS to known hosts
        run: ssh-keyscan -H ${{ secrets.VPS_HOST }} >> ~/.ssh/known_hosts

      - name: Sync landing config
        run: |
          SERVER="root@${{ secrets.VPS_HOST }}"
          rsync -avz compose/landing/docker-compose.yml ${SERVER}:/opt/services/landing/
          rsync -avz compose/landing/nginx.conf ${SERVER}:/opt/services/landing/nginx.conf

      - name: Restart landing
        run: |
          SERVER="root@${{ secrets.VPS_HOST }}"
          ssh ${SERVER} "cd /opt/services/landing && docker compose up -d"

      - name: Verify health
        run: |
          SERVER="root@${{ secrets.VPS_HOST }}"
          sleep 5
          ssh ${SERVER} "docker ps --filter name=landing --format '{{.Status}}' | grep -q 'Up'" || \
            (echo "FAIL: landing not running" && exit 1)
