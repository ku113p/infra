name: Deploy Infra

on:
  push:
    branches: [master]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Render traefik.yml
        run: envsubst '${ACME_EMAIL}' < compose/traefik/traefik.yml > /tmp/traefik.yml
        env:
          ACME_EMAIL: ${{ secrets.ACME_EMAIL }}

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.VPS_SSH_KEY }}

      - name: Add VPS to known hosts
        run: ssh-keyscan -H ${{ secrets.VPS_HOST }} >> ~/.ssh/known_hosts

      - name: Sync compose files
        run: |
          SERVER="root@${{ secrets.VPS_HOST }}"

          rsync -avz compose/interview/docker-compose.yml ${SERVER}:/opt/services/interview/
          rsync -avz compose/watchtower/docker-compose.yml ${SERVER}:/opt/services/watchtower/
          rsync -avz /tmp/traefik.yml ${SERVER}:/opt/services/traefik/traefik.yml
          rsync -avz compose/traefik/docker-compose.yml ${SERVER}:/opt/services/traefik/
          rsync -avz --delete compose/traefik/dynamic/ ${SERVER}:/opt/services/traefik/dynamic/
          rsync -avz compose/landing/docker-compose.yml ${SERVER}:/opt/services/landing/
          rsync -avz compose/monitoring/docker-compose.yml ${SERVER}:/opt/services/monitoring/

      - name: Restart services
        run: |
          SERVER="root@${{ secrets.VPS_HOST }}"
          ssh ${SERVER} "
            cd /opt/services/interview && docker compose up -d
            cd /opt/services/watchtower && docker compose up -d
            cd /opt/services/traefik && docker compose up -d
            cd /opt/services/monitoring && docker compose up -d
          "
