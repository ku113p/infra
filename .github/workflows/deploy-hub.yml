name: Deploy Hub

on:
  push:
    branches: [master]
    paths:
      - 'compose/hub/**'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.VPS_SSH_KEY }}

      - name: Add VPS to known hosts
        run: ssh-keyscan -H ${{ secrets.VPS_HOST }} >> ~/.ssh/known_hosts

      - name: Sync compose file
        run: |
          SERVER="root@${{ secrets.VPS_HOST }}"
          rsync -avz compose/hub/docker-compose.yml ${SERVER}:/opt/services/hub/

      # The image is built on the VPS by the cells repo; here we only apply the file.
      - name: Restart with the new compose file
        run: |
          SERVER="root@${{ secrets.VPS_HOST }}"
          ssh ${SERVER} "cd /opt/services/hub && docker compose up -d"

      - name: Verify health
        run: |
          SERVER="root@${{ secrets.VPS_HOST }}"
          sleep 10
          STATUS=$(ssh ${SERVER} "docker inspect hub --format '{{.State.Health.Status}}'")
          echo "hub health: $STATUS"
          if [ "$STATUS" != "healthy" ]; then
            ssh ${SERVER} "docker ps -a --filter 'name=hub' --format 'table {{.Names}}\t{{.Status}}'; docker logs --tail 30 hub"
            exit 1
          fi
