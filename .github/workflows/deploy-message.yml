name: Deploy Message

on:
  push:
    branches: [master]
    paths:
      - 'compose/message/**'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.VPS_SSH_KEY }}

      - name: Add VPS to known hosts
        run: ssh-keyscan -H ${{ secrets.VPS_HOST }} >> ~/.ssh/known_hosts

      - name: Sync compose files
        run: |
          SERVER="root@${{ secrets.VPS_HOST }}"
          rsync -avz --delete --exclude .env compose/message/ ${SERVER}:/opt/services/message/

      - name: Restart services
        run: |
          SERVER="root@${{ secrets.VPS_HOST }}"
          ssh ${SERVER} "cd /opt/services/message && docker compose up -d"

      - name: Verify health
        run: |
          SERVER="root@${{ secrets.VPS_HOST }}"
          sleep 15
          RUNNING=$(ssh ${SERVER} "docker ps --filter 'name=message' --format '{{.Names}}' | wc -l")
          if [ "$RUNNING" -lt 2 ]; then
            echo "FAIL: expected 2 message containers, found $RUNNING"
            ssh ${SERVER} "docker ps -a --filter 'name=message' --format 'table {{.Names}}\t{{.Status}}'"
            exit 1
          fi
          ssh ${SERVER} "docker ps --filter 'name=message' --format 'table {{.Names}}\t{{.Status}}\t{{.Ports}}'"
