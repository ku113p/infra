name: Deploy Price Alert Bot

on:
  push:
    branches: [master]
    paths:
      - 'compose/price-alert-bot/**'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.VPS_SSH_KEY }}

      - name: Add VPS to known hosts
        run: ssh-keyscan -H ${{ secrets.VPS_HOST }} >> ~/.ssh/known_hosts

      - name: Sync compose files
        run: |
          SERVER="root@${{ secrets.VPS_HOST }}"
          rsync -avz compose/price-alert-bot/docker-compose.yml ${SERVER}:/opt/services/price-alert-bot/

      - name: Restart services
        run: |
          SERVER="root@${{ secrets.VPS_HOST }}"
          ssh ${SERVER} "cd /opt/services/price-alert-bot && docker compose up -d"

      - name: Verify health
        run: |
          SERVER="root@${{ secrets.VPS_HOST }}"
          sleep 10
          RUNNING=$(ssh ${SERVER} "docker ps --filter 'name=price-alert-bot' --format '{{.Names}}' | wc -l")
          if [ "$RUNNING" -lt 3 ]; then
            echo "FAIL: expected 3 price-alert-bot containers, found $RUNNING"
            ssh ${SERVER} "docker ps -a --filter 'name=price-alert-bot' --format 'table {{.Names}}\t{{.Status}}'"
            exit 1
          fi
          ssh ${SERVER} "docker ps --filter 'name=price-alert-bot' --format 'table {{.Names}}\t{{.Status}}\t{{.Ports}}'"
