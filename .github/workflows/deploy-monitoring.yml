name: Deploy Monitoring

on:
  push:
    branches: [master]
    paths:
      - 'compose/monitoring/**'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.VPS_SSH_KEY }}

      - name: Add VPS to known hosts
        run: ssh-keyscan -H ${{ secrets.VPS_HOST }} >> ~/.ssh/known_hosts

      - name: Sync monitoring compose file
        run: |
          SERVER="root@${{ secrets.VPS_HOST }}"
          rsync -avz compose/monitoring/docker-compose.yml ${SERVER}:/opt/services/monitoring/

      - name: Seed Dozzle users.yml if missing
        env:
          DOZZLE_PASSWORD_HASH: ${{ secrets.DOZZLE_PASSWORD_HASH }}
        run: |
          SERVER="root@${{ secrets.VPS_HOST }}"

          # Check if users.yml already exists on VPS
          if ssh ${SERVER} "docker volume inspect monitoring_dozzle-data &>/dev/null && \
            test -f \$(docker volume inspect monitoring_dozzle-data -f '{{.Mountpoint}}')/users.yml"; then
            echo 'users.yml already exists, skipping'
          else
            echo 'Seeding users.yml...'
            envsubst '${DOZZLE_PASSWORD_HASH}' << 'EOF' > /tmp/dozzle-users.yml
          users:
              overuse:
                  name: Overuse
                  password: ${DOZZLE_PASSWORD_HASH}
          EOF

            ssh ${SERVER} "docker volume create monitoring_dozzle-data 2>/dev/null || true"
            VOLUME_PATH=$(ssh ${SERVER} "docker volume inspect monitoring_dozzle-data -f '{{.Mountpoint}}'")
            rsync -avz /tmp/dozzle-users.yml ${SERVER}:${VOLUME_PATH}/users.yml
            rm -f /tmp/dozzle-users.yml
            echo 'users.yml created'
          fi

      - name: Restart monitoring services
        run: |
          SERVER="root@${{ secrets.VPS_HOST }}"
          ssh ${SERVER} "cd /opt/services/monitoring && docker compose up -d"

      - name: Verify health
        run: |
          SERVER="root@${{ secrets.VPS_HOST }}"
          sleep 5
          RUNNING=$(ssh ${SERVER} "docker ps --filter 'name=uptime-kuma' --filter 'name=dozzle' --format '{{.Names}}' | wc -l")
          if [ "$RUNNING" -lt 2 ]; then
            echo "FAIL: expected 2 monitoring containers, found $RUNNING"
            ssh ${SERVER} "docker ps -a --filter 'name=uptime-kuma' --filter 'name=dozzle' --format 'table {{.Names}}\t{{.Status}}'"
            exit 1
          fi
          ssh ${SERVER} "docker ps --filter 'name=uptime-kuma' --filter 'name=dozzle' --format 'table {{.Names}}\t{{.Status}}'"
