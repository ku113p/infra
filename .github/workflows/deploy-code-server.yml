name: Deploy Code Server

on:
  push:
    branches: [master]
    paths:
      - 'compose/code-server/**'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.VPS_SSH_KEY }}

      - name: Add VPS to known hosts
        run: ssh-keyscan -H ${{ secrets.VPS_HOST }} >> ~/.ssh/known_hosts

      - name: Sync code-server compose file
        run: |
          SERVER="root@${{ secrets.VPS_HOST }}"
          rsync -avz compose/code-server/docker-compose.yml ${SERVER}:/opt/services/code-server/

      - name: Write .env file
        env:
          CODE_SERVER_PASSWORD: ${{ secrets.CODE_SERVER_PASSWORD }}
        run: |
          SERVER="root@${{ secrets.VPS_HOST }}"

          if [ -z "${CODE_SERVER_PASSWORD}" ]; then
            echo '::warning::CODE_SERVER_PASSWORD secret not set, skipping .env write'
            exit 0
          fi

          printf 'PASSWORD=%s\n' "${CODE_SERVER_PASSWORD}" | ssh ${SERVER} "cat > /opt/services/code-server/.env"

      - name: Restart code-server
        run: |
          SERVER="root@${{ secrets.VPS_HOST }}"
          ssh ${SERVER} "cd /opt/services/code-server && docker compose up -d"

      - name: Verify health
        run: |
          SERVER="root@${{ secrets.VPS_HOST }}"
          sleep 10
          RUNNING=$(ssh ${SERVER} "docker ps --filter 'name=code-server' --format '{{.Names}}' | wc -l")
          if [ "$RUNNING" -lt 1 ]; then
            echo "FAIL: expected 1 code-server container, found $RUNNING"
            ssh ${SERVER} "docker ps -a --filter 'name=code-server' --format 'table {{.Names}}\t{{.Status}}'"
            exit 1
          fi
          ssh ${SERVER} "docker ps --filter 'name=code-server' --format 'table {{.Names}}\t{{.Status}}'"
