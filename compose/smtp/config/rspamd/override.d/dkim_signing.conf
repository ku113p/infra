# documentation: https://rspamd.com/doc/modules/dkim_signing.html

enabled = true;

sign_authenticated = true;
sign_local = true;
try_fallback = false;

use_domain = "header";
use_redis = false;
use_esld = true;
allow_username_mismatch = true;

check_pubkey = true;

domain {
    syncapp.tech {
        path = "/tmp/docker-mailserver/rspamd/dkim/rsa-2048-mail-syncapp.tech.private.txt";
        selector = "mail";
    }
}
