services:
  backend:
    image: ghcr.io/ku113p/pay-intern/backend:latest
    container_name: intern-backend
    restart: unless-stopped
    volumes:
      - backend-data:/app/data
    env_file:
      - .env
    networks:
      - internal
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  frontend:
    image: ghcr.io/ku113p/pay-intern/frontend:latest
    container_name: intern-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - proxy
      - internal
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
      - "traefik.enable=true"
      - "traefik.http.routers.intern.rule=Host(`intern.syncapp.tech`)"
      - "traefik.http.routers.intern.entrypoints=websecure"
      - "traefik.http.routers.intern.tls.certresolver=letsencrypt"
      - "traefik.http.routers.intern.middlewares=security-headers@file,gzip@file"
      - "traefik.http.services.intern.loadbalancer.server.port=80"
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.25'
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1/"]
      interval: 30s
      timeout: 3s
      retries: 3

networks:
  proxy:
    external: true
  internal:
    name: intern-internal

volumes:
  backend-data:
    name: intern-backend-data
