services:
  app:
    image: ghcr.io/ku113p/tools-mcp:latest
    container_name: tools-mcp-app
    restart: unless-stopped
    environment:
      HOST: 0.0.0.0
      PORT: 8080
    env_file:
      - .env
    networks:
      - proxy
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
      - "traefik.enable=true"
      - "traefik.http.routers.tools-mcp.rule=Host(`mcp.tools.syncapp.tech`)"
      - "traefik.http.routers.tools-mcp.entrypoints=websecure"
      - "traefik.http.routers.tools-mcp.tls.certresolver=letsencrypt"
      - "traefik.http.services.tools-mcp.loadbalancer.server.port=8080"
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.5'
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f 'server' || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

networks:
  proxy:
    external: true
